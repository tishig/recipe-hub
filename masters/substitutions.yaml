# 互換表。from の代わりに to を使える。both: true なら逆向きも可。ratio: from 1 に対する to の量
- kind: ingredient
  from: unsalted-butter
  to: salted-butter
  ratio: 1
  both: false
  note: 同じ量で使い、レシピの塩を減らす（バター100gあたり塩約1.5gが目安）
  added_by: seed
- kind: ingredient
  from: brown-sugar
  to: granulated-sugar
  ratio: 1
  both: false
  note: 同じ量で使える。コクと香りは弱くなる。モラセスを少し足すと近づく
  added_by: seed
- kind: ingredient
  from: granulated-sugar
  to: japanese-white-sugar
  ratio: 1
  both: true
  note: 同じ量で使える。焼き色や食感が少し変わる
  added_by: seed
- kind: ingredient
  from: lemon-juice
  to: lime-juice
  ratio: 1
  both: true
  note: 同じ量で使える。香りが変わる
  added_by: seed
- kind: ingredient
  from: cornstarch
  to: potato-starch
  ratio: 1
  both: true
  note: 同じ量で使える。とろみの付き方や冷めたときの状態が少し違う
  added_by: seed
- kind: ingredient
  from: cake-flour
  to: all-purpose-flour
  both: false
  note: 同じ量で使える。生地がやや重くなる
  added_by: seed
- kind: ingredient
  from: buttermilk
  to: milk
  both: false
  note: 牛乳1カップ（240mL）にレモン汁大さじ1を混ぜて5分置いたものを同じ量使う
  added_by: seed
- kind: ingredient
  from: mirin
  to: sake
  both: false
  note: みりん大さじ1の代わりに、酒大さじ1と砂糖小さじ1
  added_by: seed
- kind: equipment
  from: oven
  to: toaster-oven
  both: false
  note: 温度設定があれば同じ温度で。庫内が狭く上が焦げやすいので、途中でアルミホイルをかぶせる。型が入るか確認する
  added_by: seed
- kind: equipment
  from: baking-sheet
  to: pizza-stone
  both: true
  note: そのまま置き換えられる。ピザストーンは予熱に時間がかかる
  added_by: seed
- kind: equipment
  from: whisk
  to: hand-mixer
  both: false
  note: 混ぜすぎに注意
  added_by: seed
- kind: equipment
  from: refrigerator
  to: freezer
  both: false
  note: 冷やす時間を短くできる。凍らせすぎに注意
  added_by: seed
